<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contato – Esperança Digital</title>
</head>
<body>
  <header>
    <h1>Esperança Digital – Inclusão para todos</h1>
    <button class="menu-toggle" aria-label="Abrir menu">&#9776;</button>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="sobre.html">Sobre nós</a></li>
        <li><a href="projetos.html">Projetos</a></li>
      </ul>
    </nav>
    <button id="toggle-contrast">Alto contraste</button>
  </header>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO básico -->
  <meta name="description" content="Esperança Digital – Inclusão para todos. Projetos sociais e digitais que promovem acessibilidade e oportunidades.">
  <meta name="keywords" content="inclusão digital, acessibilidade, projetos sociais, esperança digital, tecnologia para todos">
  <meta name="author" content="Esperança Digital">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./src/favicon.png">

  <title>Esperança Digital – Início</title>
</head>

  <main>
    <section>
      <h2>Nosso contato</h2>
      <p>📧 Email: contato@esperancadigital.org</p>
      <p>📞 Telefone: (66) 99999-9999</p>
      <p>🌐 Redes sociais: @esperancadigital</p>
    </section>

    <section>
      <h2>Envie sua mensagem</h2>
      <form>
        <label for="nome">Seu nome:</label>
        <input id="nome" type="text" required>

        <label for="email">Seu email:</label>
        <input id="email" type="email" required>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" required></textarea>

        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Esperança Digital</p>
  </footer>

  <!-- Scripts -->
  <script>
    // Menu responsivo
    const menuToggle = document.querySelector('.menu-toggle');
    const navMenu = document.querySelector('nav ul');
    menuToggle.addEventListener('click', () => {
      navMenu.classList.toggle('show');
    });
  </script>

  <script>
    // Alto contraste com persistência
    const toggleContrast = document.querySelector('#toggle-contrast');
    const body = document.body;

    if (localStorage.getItem('contrast') === 'high') {
      body.classList.add('high-contrast');
    }

    toggleContrast.addEventListener('click', () => {
      body.classList.toggle('high-contrast');
      localStorage.setItem('contrast', body.classList.contains('high-contrast') ? 'high' : 'normal');
    });
  </script>

  <!-- Importação do bundle Vite -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
